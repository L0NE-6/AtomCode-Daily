name: AtomCode Daily

on:
  # schedule:
  #   - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: AtomCode-Daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run AtomCode Daily
        env:
          ATOMCODE_TOKENS: ${{ secrets.ATOMCODE_TOKENS }}
          ATOMCODE_TOKEN: ${{ secrets.ATOMCODE_TOKEN }}
          ATOMCODE_REFRESH_TOKEN: ${{ secrets.ATOMCODE_REFRESH_TOKEN }}
          ATOMCODE_EXPIRES_AT: ${{ secrets.ATOMCODE_EXPIRES_AT }}
          ATOMCODE_PROXY: ${{ secrets.ATOMCODE_PROXY }}
          PLUSPLUS_TOKEN: ${{ secrets.PLUSPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: python atomcode_daily.py
